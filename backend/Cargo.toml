[package]
name = "socartes-backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "socartes_backend"
path = "src/lib.rs"

[[bin]]
name = "socartes-backend"
path = "src/main.rs"

[[bin]]
name = "socartes"
path = "src/bin/socartes.rs"

[[bin]]
name = "socartes-cli"
path = "src/bin/socartes_cli.rs"

[[bin]]
name = "socartes_cli"
path = "src/bin/socartes_cli_underscore.rs"

[[bin]]
name = "deeptutor"
path = "src/bin/deeptutor.rs"

[[bin]]
name = "deeptutor-cli"
path = "src/bin/deeptutor_cli.rs"

[[bin]]
name = "deeptutor_cli"
path = "src/bin/deeptutor_cli_underscore.rs"

[dependencies]
arc-swap = "1.7"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8.35"
futures-util = "0.3"
http-body-util = "0.1"
jsonwebtoken = "9"
json5 = "1.3.1"
pdf-extract = "0.10.0"
quick-xml = "0.40.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
scraper = "0.27"
uuid = { version = "1", features = ["v4"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
tower = { version = "0.5", features = ["util"] }
